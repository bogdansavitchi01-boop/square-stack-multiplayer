name: Build Square Stack Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "electron-main.js"
      - "package.json"
      - "package-lock.json"
      - "*.js"
      - "*.html"
      - "*.css"
      - "*.zip"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SquareStack-Windows-Installer
          path: dist/SquareStack-Setup.exe
          if-no-files-found: error
          retention-days: 30
